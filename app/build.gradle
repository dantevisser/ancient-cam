plugins { id 'com.android.application' }

android {
    namespace 'za.web.visser.ancientcam'
    compileSdk 34

    defaultConfig {
        applicationId 'za.web.visser.ancientcam'
        minSdk 21
        targetSdk 28          // pre-29 so BOOT_COMPLETED can launch an Activity directly
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'armeabi-v7a' }   // the Tab2 A7 is 32-bit ARMv7 only
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging { jniLibs { useLegacyPackaging = true } }

    buildTypes { debug { debuggable true } }
}

dependencies {
    // ExoPlayer/Media3: pure-Java RTSP (no live555), so no ourIPAddress()/0.0.0.0 problem.
    // media3 1.x supports minSdk 21. RtspMediaSource can force RTP-over-TCP.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}
